[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-rag-hhgoa"
version = "0.1.0"
description = "Voice-enabled, guarded, multi-strategy RAG system for HH Goa Task 2"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
production = [
  "qdrant-client>=1.12",
  "sentence-transformers>=3.0",
  "datasets>=2.20",
  "groq>=0.11",
]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
